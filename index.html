let stage=0,name='';const app=document.querySelector('#app');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const art=()=>{if(stage===6)return `<figure class="visual reveal-visual"><div class="reveal-photo"><img src="reveal.jpg" alt="우리 아기 뿡치의 첫 초음파 사진" width="1200" height="1600"><figcaption>안녕, 뿡치야 ♡</figcaption></div></figure>`;if(stage===2)return `<figure class="visual character-visual"><div class="orbit"></div><div class="character-photo"><img src="ppungppung.png" alt="양손 검지를 들고 있는 주황색 캐릭터 뿡뿡이" width="480" height="341"><figcaption><span>MEET THE ORIGINAL</span><strong>이 친구, 기억나시죠?</strong><small>뿡뿡이의 사촌동생 이름은… 뿡치!</small></figcaption></div></figure>`;const labels=['A familiar name. A new beginning.','Your first look at ppungchi','The name behind the story','From slime to something new','A little closer, every day','Coming to the world · June 2027','Our little ppungchi','A letter to ppungchi'];return `<div class="visual" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div>${stage<6?`<div class="cube"><span style="font-size:54px">${['뿡','↗','?','∞','＋','06'][stage]}</span></div><div class="spark">✳</div><div class="tag">PPUNGCHI PROJECT<b>${labels[stage]}</b></div>`:'<div class="heart">♡</div><div class="family"><div class="person"></div><div class="person"></div><div class="person small"></div></div><div class="tag">HELLO, LITTLE ONE<b>Our little ppungchi · Coming June 2027</b></div>'}</div>`};
function render(){document.body.classList.toggle('reveal',stage>=6);const n=esc(name);let c='';if(stage===0)c=`<div class="eyebrow">PPUNGCHI / PRIVATE BETA</div><h1>뿡치, 새로운 모습으로<br>돌아옵니다.</h1><p>어디선가 들어본 듯한 이름, 뿡치.<br>그 이름으로 새로운 서비스를 준비하고 있어요.<br>정식 오픈 전, 가장 먼저 만나보세요.</p><button class="primary" onclick="next()">뿡치 서비스 미리보기 <span>↗</span></button><div class="note">비공개 테스트 · 약 1분 소요</div>`;
if(stage===1)c=`<div class="eyebrow">01 / FIRST TESTER</div><h1>가장 먼저 만나줄<br>당신의 이름은?</h1><p>뿡치의 새로운 시작을 함께할 분을 찾고 있어요.<br>이름이나 닉네임을 알려주세요.</p><form id="nameform"><input id="name" aria-label="이름 또는 닉네임" placeholder="이름 또는 닉네임" maxlength="20" autocomplete="given-name" value="${n}" required><button class="primary" type="submit">테스트 시작하기 <span>→</span></button></form>`;
if(stage===2)c=`<div class="eyebrow">02 / THE NAME</div><h1>혹시,<br>뿡치를 아시나요?</h1><p>우리끼리 소개하자면,<br>뿡뿡이의 사촌동생을 <strong style="color:var(--green)">‘뿡치’</strong>라고 해요.<br>한 번 들으면 잊기 어려운 이름이죠.</p><div class="notice" style="color:#6d7c64;margin-bottom:24px">오늘 이야기의 주인공 이름도 뿡치예요.<br>이 이름, 잠깐 기억해주세요.</div><button class="primary" onclick="next()">그 뿡치로 뭘 하는데? <span>→</span></button>`;
if(stage===3)c=`<div class="eyebrow">03 / WHERE IT ALL STARTED</div><h1>시작은,<br>뿡치 슬라임.</h1><p>예전에 아내가 직접 슬라임을 만들어 판매하던<br>작은 개인사업, <strong style="color:var(--green)">‘뿡치 슬라임’</strong>이 있었어요.<br>손으로 만지고, 가지고 놀고,<br>작은 즐거움을 나누던 이름이었죠.</p><button class="primary" onclick="next()">그리고, 다음 이야기는? <span>→</span></button>`;
if(stage===4)c=`<div class="eyebrow">04 / THE NEXT CHAPTER</div><h1>그 이름을 이어받아,<br>뿡치 서비스를 엽니다.</h1><p>이번에는 개발자인 제가 함께 준비합니다.<br>아내의 뿡치에, 저의 새로운 시작을 더했어요.</p><ul class="checks"><li>준비하는 사람은 둘</li><li>만날 수 있는 뿡치는 단 하나</li><li>시간이 흐를수록 조금씩 성장하는 서비스</li></ul><button class="primary" onclick="next()">정식 출시는 언제야? <span>→</span></button>`;
if(stage===5)c=`<div class="eyebrow">05 / SAVE THE DATE</div><h1>2027년 정미년,<br>6월 정식 출시 예정.</h1><p>뿡치가 세상과 처음 만날 날을 기다리고 있어요.<br>아직 준비할 게 많지만,<br>가까운 분들께는 먼저 소개하고 싶었어요.</p><div class="notice" style="color:#6d7c64;margin-bottom:24px"><strong>PPUNGCHI · COMING JUNE 2027</strong><br>이제, 뿡치의 진짜 정체를 공개합니다.</div><button class="primary" onclick="prepareReveal()">뿡치의 정체 확인하기 <span>→</span></button>`;
if(stage===6)c=`<div class="eyebrow">짜잔! 🎉 / HELLO, PPUNGCHI</div><h1>사실 뿡치는,<br>우리 아기 태명이에요.</h1><p><strong style="color:#956243">${n}님, 우리 엄마 아빠가 됩니다 👶</strong><br>아내가 만들던 뿡치 슬라임의 이름을 이어받아,<br>이번에는 우리 가족의 새 식구를 기다리고 있어요.<br>2027년 6월, 뿡치가 세상에 인사할 예정이에요.</p><button class="primary" onclick="next()">뿡치에게 첫 인사 남기기 <span>♡</span></button><div class="note">이 소식은 저희가 직접 전할 때까지 비밀로 부탁해요.</div>`;
if(stage===7)c=`<div class="eyebrow">A FIRST LETTER TO PPUNGCHI</div><h1>뿡치의 시작을<br>함께해줘서 고마워요.</h1><p>뿡치가 크면 함께 읽어볼 수 있도록,<br>첫 인사를 남겨주세요.</p><textarea id="message" maxlength="500" aria-label="아기에게 전할 메시지" placeholder="뿡치야, 세상에 온 걸 미리 환영해!"></textarea><div id="error" class="error" role="status" aria-live="polite"></div><button class="primary" id="save-message" onclick="saveNote()">메시지 저장하기 <span>♡</span></button><div class="note">이름과 메시지가 뿡치의 비공개 편지함에 저장됩니다.<br>다른 방문자에게는 공개되지 않아요.</div><button class="back" onclick="stage=6;render()">← 뿡치 소식 다시 보기</button>`;
app.innerHTML=`<section class="step">${c}</section>${art()}`;document.querySelector('#progress').innerHTML=Array.from({length:8},(_,i)=>`<i class="${i<=stage?'active':''}"></i>`).join('');if(stage===1)document.querySelector('#nameform').onsubmit=e=>{e.preventDefault();name=document.querySelector('#name').value.trim();if(name)next()};if(stage===7)restoreSavedNote();window.scrollTo({top:0,behavior:'smooth'});}

function prepareReveal(){if(document.querySelector('.suspense'))return;const layer=document.createElement('div');layer.className='suspense';layer.setAttribute('role','dialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-label','뿡치 공개 카운트다운');layer.innerHTML='<div class="pulse-ring"></div><div class="pulse-ring r2"></div><div class="pulse-ring r3"></div><div class="suspense-inner"></div>';document.body.append(layer);document.querySelector('#app').inert=true;layer.addEventListener('keydown',e=>{if(e.key==='Escape')closeSuspense();if(e.key==='Tab'){e.preventDefault();layer.querySelector('button')?.focus()}});startCountdown();}

function startCountdown(){const layer=document.querySelector('.suspense');if(!layer)return;let tick=0;const frames=[['3','뿡치를 소개합니다.'],['2','곧 만나요!'],['1','짜잔…!']];function play(){if(tick===frames.length){closeSuspense();reveal();document.querySelector('#app .primary')?.focus();return}const [number,caption]=frames[tick++];layer.querySelector('.suspense-inner').innerHTML=`<div class="eyebrow">THE SECRET IS ABOUT TO OPEN</div><div class="countdown-number" aria-hidden="true">${number}</div><div class="count-caption" role="status">${caption}</div><button class="skip" onclick="closeSuspense();reveal()">바로 공개하기 →</button>`;layer.querySelector('button').focus();revealTimer=setTimeout(play,1400)}play()}

function getFirebase(){if(!firebaseReady)firebaseReady=Promise.all([import('https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore-lite.js')]).then(async([appSDK,authSDK,dbSDK])=>{const app=appSDK.initializeApp(firebaseConfig),auth=authSDK.getAuth(app);await auth.authStateReady();const user=auth.currentUser||(await authSDK.signInAnonymously(auth)).user;return{dbSDK,db:dbSDK.getFirestore(app),user}}).catch(error=>{firebaseReady=null;throw error});return firebaseReady}
function restoreSavedNote(){const button=document.querySelector('#save-message');if(savedNote){button.disabled=true;button.textContent='저장 완료 ♡';document.querySelector('#message').disabled=true;document.querySelector('#error').textContent='뿡치에게 첫 편지가 도착했어요. 소중히 간직할게요 💌'}else if(savingNote){button.disabled=true;button.textContent='저장 중…'}}
async function saveNote(){if(savingNote||savedNote)return;const field=document.querySelector('#message'),status=document.querySelector('#error'),button=document.querySelector('#save-message'),message=field.value.trim(),author=name.trim();if(!message){status.textContent='뿡치에게 짧은 한마디를 먼저 적어주세요.';field.focus();return}if(!author||author.length>20||message.length>500){status.textContent='이름은 20자, 메시지는 500자 이내로 입력해주세요.';return}savingNote=true;button.disabled=true;field.disabled=true;button.textContent='저장 중…';status.textContent='뿡치의 편지함에 연결하고 있어요…';const slow=setTimeout(()=>{if(savingNote&&status.isConnected)status.textContent='연결이 조금 늦어지고 있어요. 이 화면을 유지해주세요.'},10000);try{const{dbSDK,db,user}=await getFirebase();const ref=dbSDK.doc(db,'messages',user.uid);const existing=await dbSDK.getDoc(ref);if(!existing.exists())await dbSDK.setDoc(ref,{name:author,message,authorUid:user.uid,createdAt:dbSDK.serverTimestamp()});savedNote=true;if(button.isConnected){button.textContent='저장 완료 ♡';status.style.color='#345b44';status.textContent='뿡치에게 첫 편지가 도착했어요. 소중히 간직할게요 💌'}}catch(error){const code=error.code||'';if(status.isConnected){status.style.color='';status.textContent=code==='permission-denied'?'아직 편지함을 열지 못했어요. 작성한 내용은 그대로 있으니 잠시 후 다시 시도해주세요.':code.startsWith('auth/')?'편지함 연결을 준비 중이에요. 잠시 후 다시 시도해주세요.':'저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해주세요.';button.disabled=false;field.disabled=false;button.textContent='다시 저장하기 ♡'}console.warn('Message save failed:',code||error.name)}finally{clearTimeout(slow);savingNote=false}}
render();
